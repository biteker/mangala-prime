version: '3.8'

services:
  postgres-db:
    image: postgres:18-alpine
    container_name: global-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_MULTIPLE_DATABASES=mangala_db
    ports:
      # Güvenlik için sadece localhost loopback adresine (127.0.0.1) bağlanır.
      # Dış ağlardan veya internetten erişilemez.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - db-network

networks:
  db-network:
    name: web-network
    external: true

volumes:
  postgres_data:
